<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Meus Chamados</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
<script>
(function () {
  try {
    var u = JSON.parse(localStorage.getItem("workflow_zagonel_usuario"));
    document.documentElement.setAttribute("data-tema", (u && u.tema) || "claro");
    document.documentElement.setAttribute("data-fonte", (u && u.fonte) || "arial");
    document.documentElement.setAttribute("data-tamanho", (u && u.tamanho_fonte) || "m");
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="nav"></div>
<main>
  <h1>Meus chamados</h1>
  <p id="mensagem-erro" class="erro" hidden></p>
  <p id="link-novo-chamado"><a href="novo-chamado.html">+ Abrir novo chamado</a></p>
  <table>
    <thead><tr><th>Chamado</th><th>Status</th><th>Prazo</th><th>Situação</th></tr></thead>
    <tbody id="tabela-chamados"></tbody>
  </table>
</main>
<script type="module" src="chamados.js"></script>
</body>
</html>
