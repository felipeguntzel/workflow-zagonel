<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Chamado</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
<script>
(function () {
  try {
    var u = JSON.parse(localStorage.getItem("workflow_zagonel_usuario"));
    document.documentElement.setAttribute("data-tema", (u && u.tema) || "claro");
    document.documentElement.setAttribute("data-fonte", (u && u.fonte) || "arial");
    document.documentElement.setAttribute("data-tamanho", (u && u.tamanho_fonte) || "m");
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="nav"></div>
<main>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem;">
    <p style="margin: 0;">
      <a href="/chamados" class="link-sem-sublinhado">← Meus chamados</a>
      <span style="color: var(--cor-borda); margin: 0 0.35rem;">|</span>
      <a id="link-geral" href="#" class="link-sem-sublinhado">Ver chamado geral</a>
    </p>
    <button type="button" id="btn-excluir-chamado" class="btn btn-perigo btn-pequeno">Excluir chamado</button>
  </div>
  
  <p id="mensagem-erro" class="erro" hidden></p>
  
  <!-- Card 1: Dados Principais e Obrigatórios do Chamado -->
  <div id="detalhe" class="painel painel-chamado" hidden></div>

  <!-- Card 2: Campos Dinâmicos do Chamado -->
  <section id="secao-campos-dinamicos" class="painel painel-chamado" hidden>
    <div id="cabecalho-campos-dinamicos" class="painel-chamado-cabecalho">
      <div class="cabecalho-lado-esquerdo">
        <h2 class="cabecalho-titulo">📋 Campos da Solicitação / Etapa</h2>
      </div>
      <div class="cabecalho-lado-direito">
        <button type="button" id="btn-salvar-campos-dinamicos" class="btn btn-primario btn-acao-cabecalho" hidden>Salvar alterações</button>
        <button type="button" id="btn-recolher-campos" class="btn btn-secundario btn-acao-cabecalho btn-recolher-card" title="Recolher / Expandir">▲ Recolher</button>
      </div>
    </div>
    <p id="msg-erro-campos" class="erro" hidden></p>
    <div id="msg-sucesso-campos" class="toast-status-rapido" style="margin-bottom: 0.5rem;" hidden>✓ Campos salvos com sucesso.</div>
    <div id="conteudo-campos-dinamicos"></div>
  </section>

  <!-- Card 3: Ação / Aprovação (quando aplicável) -->
  <div id="acao" class="painel painel-chamado" hidden></div>

  <!-- Card 4: Comentários e Anexos Unificados (com atalho para tela suspensa de horas) -->
  <section id="card-comentarios-anexos" class="painel painel-chamado">
    <div class="painel-chamado-cabecalho">
      <div class="cabecalho-lado-esquerdo">
        <h2 class="cabecalho-titulo">💬 Comentários e Anexos</h2>
      </div>
      <div class="cabecalho-lado-direito">
        <button type="button" id="btn-abrir-modal-horas" onclick="window.abrirModalHoras &amp;&amp; window.abrirModalHoras()" class="btn btn-secundario btn-acao-cabecalho" style="display: inline-flex; align-items: center; gap: 0.35rem;" title="Abrir tela suspensa para apontamento rápido de horas">
          ⏱️ Apontar Horas
        </button>
      </div>
    </div>

    <!-- Lista Unificada de Comentários e Anexos -->
    <ul id="lista-comentarios" style="list-style: none; padding: 0; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem;"></ul>

    <!-- Formulário Unificado: Comentário + Anexo -->
    <form class="formulario" id="form-comentario" style="display: flex; flex-direction: column; gap: 0.6rem;">
      <label class="campo-rotulo" for="textarea-comentario" style="font-weight: 600;">Novo comentário ou anexo</label>
      <textarea name="texto" id="textarea-comentario" style="width: 100%; min-height: 70px;" placeholder="Digite seu comentário, anexe arquivos abaixo ou cole prints com Ctrl+V..."></textarea>
      
      <!-- Preview do print colado via Ctrl+V -->
      <div id="preview-print-comentario" class="preview-print-wrap" hidden>
        <img id="img-preview-print" class="preview-print-img" alt="Print colado">
        <div style="flex: 1; min-width: 0;">
          <div id="nome-print-comentario" style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
          <div style="font-size: 0.75rem; color: var(--cor-texto-secundario);">Imagem da área de transferência (print colado)</div>
        </div>
        <button type="button" id="btn-remover-print" class="btn-icone btn-icone--excluir" title="Remover imagem" aria-label="Remover imagem">✕</button>
      </div>

      <!-- Área de Anexo Integrada -->
      <div style="display: flex; flex-direction: column; gap: 0.5rem; background: var(--cor-fundo); padding: 0.65rem 0.85rem; border-radius: 0.35rem; border: 1px solid var(--cor-borda);">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;">
          <label style="display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--cor-primaria);">
            <span>📎 Adicionar arquivo anexo</span>
            <input type="file" id="input-arquivo-anexo" style="display: none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt,.csv">
          </label>
          <span style="font-size: 0.75rem; color: var(--cor-texto-secundario);">PDF, XLSX, DOCX, PNG, JPG, CSV (Máx. 2MB)</span>
        </div>

        <div id="preview-anexo-wrap" hidden></div>
        <p id="msg-erro-anexo" class="erro" style="margin: 0.2rem 0 0;" hidden></p>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem; flex-wrap: wrap; gap: 0.5rem;">
        <label class="label-checkbox-linha">
          <input type="checkbox" id="check-comentario-privado">
          <span>Comentário/anexo privado (visível apenas para o setor desta etapa)</span>
        </label>
        <button type="submit" class="btn btn-primario" id="btn-submit-comentario">Enviar comentário</button>
      </div>
    </form>
  </section>

  <!-- Histórico Unificado de Auditoria -->
  <section class="painel painel-chamado">
    <div class="painel-chamado-cabecalho">
      <div class="cabecalho-lado-esquerdo">
        <h2 class="cabecalho-titulo">📜 Histórico Unificado de Ações</h2>
      </div>
    </div>
    <div id="historico-auditoria-wrap" style="max-height: 280px; overflow-y: auto; padding-right: 0.5rem;">
      <ul id="lista-historico-auditoria" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;"></ul>
    </div>
  </section>
</main>

<!-- Modal Suspenso para Apontamento Rápido de Horas -->
<div id="modal-horas-container"></div>

<!-- Modal / Lightbox para Visualização Direta de Imagens -->
<div id="modal-imagem-container"></div>

<script type="module" src="chamado.js"></script>
</body>
</html>
