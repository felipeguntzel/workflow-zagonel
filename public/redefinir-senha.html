<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Redefinir Senha</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
</head>
<body>
<div class="login-split">
  <div class="login-split__destaque">
    <img src="favicon.svg" alt="" class="login-split__logo">
    <h1>WorkFlow Zagonel</h1>
  </div>
  <div class="login-split__form">
    <div class="login-card" id="painel-redefinir">
      <form class="formulario" id="form-redefinir-senha" style="border: none; box-shadow: none; padding: 0; max-width: 100%; gap: 1rem;">
        <h2>Redefinir Senha</h2>
        <p id="subtitulo-usuario" style="color: var(--cor-texto-secundario); font-size: 0.88rem; margin: -0.25rem 0 0.5rem; line-height: 1.45;">
          Digite sua nova senha de acesso.
        </p>

        <div style="margin-bottom: 0.5rem;">
          <button type="button" id="btn-gerar-senha-redefinir" class="btn-gerador-senha" title="Clique para gerar e preencher automaticamente uma senha aleatória segura">
            ⚡ Gerar senha aleatória segura (6 dígitos)
          </button>
          <div id="painel-senha-gerada" hidden style="margin-top: 0.5rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 6px; padding: 0.6rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
            <div>
              <span style="color: var(--cor-texto-secundario);">Senha gerada: </span>
              <strong id="texto-senha-gerada" style="font-family: monospace; font-size: 1.05rem; letter-spacing: 1px; color: #15803d;"></strong>
            </div>
            <button type="button" id="btn-copiar-senha-gerada" class="btn-copiar-gerada" title="Copiar senha para a área de transferência">
              Copiar
            </button>
          </div>
        </div>

        <label>Nova senha <span class="info" title="Mínimo de 6 e máximo de 10 caracteres. Permite números, letras e símbolos. Se apenas números, não pode conter repetidos nem sequências de 1 em 1.">i</span>
          <div style="display: flex; gap: 0.4rem; align-items: center;">
            <input type="password" name="nova_senha" id="input-nova-senha" required minlength="6" maxlength="10" autocomplete="new-password" placeholder="Mínimo 6 e máximo 10 caracteres" style="flex: 1;">
            <button type="button" class="btn-toggle-senha" data-alvo="input-nova-senha" title="Visualizar ou ocultar senha" aria-label="Visualizar ou ocultar senha" style="display: inline-flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button type="button" class="btn-copiar-campo" data-alvo="input-nova-senha" title="Copiar senha">📋</button>
          </div>
        </label>

        <label>Confirmar nova senha
          <div style="display: flex; gap: 0.4rem; align-items: center;">
            <input type="password" name="confirmar_senha" id="input-confirmar-senha" required minlength="6" maxlength="10" autocomplete="new-password" placeholder="Repita a nova senha para confirmar" style="flex: 1;">
            <button type="button" class="btn-toggle-senha" data-alvo="input-confirmar-senha" title="Visualizar ou ocultar senha" aria-label="Visualizar ou ocultar senha" style="display: inline-flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button type="button" class="btn-copiar-campo" data-alvo="input-confirmar-senha" title="Copiar senha">📋</button>
          </div>
        </label>

        <div id="aviso-capslock-redefinir" hidden style="display: none; align-items: center; gap: 0.35rem; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">
          <span>⚠️ Caps Lock ativado</span>
        </div>

        <button type="submit" id="btn-salvar" style="width: 100%; margin-top: 0.4rem;">Salvar nova senha</button>
        <p id="mensagem-erro" class="erro" hidden></p>
        <p id="mensagem-sucesso" class="mensagem-sucesso" hidden style="background: rgba(34, 197, 94, 0.15); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); padding: 0.75rem; border-radius: 6px; font-weight: 500;"></p>

        <div style="text-align: center; margin-top: 0.5rem;">
          <a href="/" class="btn-link">&larr; Voltar para o login</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script type="module" src="redefinir-senha.js?v=20260923-2"></script>
</body>
</html>
