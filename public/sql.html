<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Editor SQL (Administrador)</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
<link rel="stylesheet" href="sql.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  try {
    var u = JSON.parse(localStorage.getItem("workflow_zagonel_usuario"));
    document.documentElement.setAttribute("data-tema", (u && u.tema) || "claro");
    document.documentElement.setAttribute("data-fonte", (u && u.fonte) || "arial");
    document.documentElement.setAttribute("data-tamanho", (u && u.tamanho_fonte) || "m");
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="nav"></div>
<main>
  <div id="sql-container"></div>
</main>
<script type="module" src="sql.js"></script>
</body>
</html>
