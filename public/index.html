<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Entrar</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
</head>
<body>
<div class="login-split">
  <div class="login-split__destaque">
    <img src="favicon.svg" alt="" class="login-split__logo">
    <h1>WorkFlow Zagonel</h1>
  </div>
  <div class="login-split__form">
    <!-- Formulário de Login -->
    <form class="formulario login-card" id="form-login">
      <h2>Entrar</h2>
      <label>Usuário ou E-mail
        <input type="text" name="login" required autocomplete="username" placeholder="Ex: felipe.guntzel ou e-mail">
      </label>
      <label>Senha
        <div style="display: flex; gap: 0.4rem; align-items: center;">
          <input type="password" name="senha" id="input-senha-login" required autocomplete="current-password" placeholder="Sua senha de acesso" style="flex: 1;">
          <button type="button" class="btn-toggle-senha" id="btn-toggle-senha-login" data-alvo="input-senha-login" title="Visualizar ou ocultar senha" aria-label="Visualizar ou ocultar senha" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.55rem 0.65rem;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="aviso-capslock-login" hidden style="display: none; align-items: center; gap: 0.35rem; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-top: 0.4rem;">
          <span>⚠️ Caps Lock ativado</span>
        </div>
      </label>
      <div style="display: flex; justify-content: flex-end; margin-top: -0.25rem; margin-bottom: 0.5rem;">
        <button type="button" id="btn-esqueci-senha" class="btn-link">Esqueci minha senha</button>
      </div>
      <button type="submit" id="btn-submit-login">Entrar</button>
      <div id="mensagem-erro" class="erro" hidden></div>
    </form>

    <!-- Formulário de Recuperação de Acesso -->
    <form class="formulario login-card" id="form-recuperar-senha" hidden>
      <h2>Recuperar Acesso</h2>
      <p style="color: var(--cor-texto-secundario); font-size: 0.88rem; margin: -0.25rem 0 0.5rem; line-height: 1.5;">
        Informe seu <strong>usuário</strong> ou <strong>e-mail</strong> cadastrado. Enviaremos as instruções para você redefinir sua senha com segurança.
      </p>

      <div style="background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(202, 138, 4, 0.3); border-radius: 6px; padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #854d0e; line-height: 1.4; display: flex; gap: 0.45rem; align-items: flex-start;">
        <span style="font-size: 1rem; line-height: 1;">📬</span>
        <span><strong>Lembrete:</strong> O e-mail de redefinição pode ser direcionado para sua pasta de <strong>Lixo Eletrônico</strong> ou <strong>Spam</strong>.</span>
      </div>

      <label>Usuário ou E-mail
        <input type="text" id="recuperar-identificador" required placeholder="Ex: felipe.guntzel ou nome@zagonel.com.br" autocomplete="username">
      </label>
      <button type="submit" id="btn-enviar-recuperacao">Enviar link de recuperação</button>
      <div style="display: flex; justify-content: center; margin-top: 0.25rem;">
        <button type="button" id="btn-cancelar-recuperacao" class="btn-link">
          &larr; Voltar para o login
        </button>
      </div>
      <div id="msg-recuperacao-erro" class="erro" hidden style="margin-top: 0.75rem;"></div>
      <div id="msg-recuperacao-sucesso" hidden style="margin-top: 0.75rem; background: rgba(34, 197, 94, 0.12); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); padding: 0.85rem; border-radius: 6px; font-size: 0.88rem; line-height: 1.5;"></div>
    </form>
  </div>
</div>
<script type="module" src="index.js?v=20260923-2"></script>
</body>
</html>
