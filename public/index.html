<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Entrar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
</head>
<body>
<div class="login-split">
  <div class="login-split__destaque">
    <img src="favicon.svg" alt="" class="login-split__logo">
    <h1>WorkFlow Zagonel</h1>
  </div>
  <div class="login-split__form">
    <form class="formulario" id="form-login">
      <h2>Entrar</h2>
      <label>Usuário ou E-mail
        <input type="text" name="login" required autocomplete="username" placeholder="Seu login ou e-mail cadastrado">
      </label>
      <label>Senha
        <input type="password" name="senha" required autocomplete="current-password" placeholder="Sua senha de acesso">
        <div id="aviso-capslock-login" hidden style="display: none; align-items: center; gap: 0.35rem; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-top: 0.4rem;">
          <span>⚠️ Caps Lock ativado</span>
        </div>
      </label>
      <div style="display: flex; justify-content: flex-end; margin-top: -0.25rem; margin-bottom: 0.75rem;">
        <button type="button" id="btn-esqueci-senha" style="background: none; border: none; padding: 0; font-size: 0.85rem; color: var(--cor-primaria); cursor: pointer; text-decoration: underline;">Esqueci minha senha</button>
      </div>
      <button type="submit">Entrar</button>
      <p id="mensagem-erro" class="erro" hidden></p>
    </form>

    <!-- Painel de recuperação de senha -->
    <div id="painel-recuperacao" hidden class="formulario" style="margin-top: 1rem; border-top: 1px solid var(--cor-borda); padding-top: 1.25rem;">
      <h3 style="font-size: 1.15rem; margin: 0 0 0.4rem;">Recuperar Acesso</h3>
      <p style="color: var(--cor-texto-secundario); font-size: 0.88rem; margin: 0 0 1rem; line-height: 1.5;">
        Informe seu <strong>usuário</strong> ou <strong>e-mail</strong> cadastrado. Enviaremos as instruções para você redefinir sua senha com segurança.
      </p>
      <form id="form-recuperar-senha">
        <label>Usuário ou E-mail
          <input type="text" id="recuperar-identificador" required placeholder="Ex: felipe ou nome@zagonel.com.br">
        </label>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.6rem;">
          <button type="submit" id="btn-enviar-recuperacao" style="flex: 1;">Enviar link de recuperação</button>
          <button type="button" id="btn-cancelar-recuperacao" style="background: var(--cor-fundo-elevado); color: var(--cor-texto); border: 1px solid var(--cor-borda);">Cancelar</button>
        </div>
        <p id="msg-recuperacao-erro" class="erro" hidden style="margin-top: 0.8rem;"></p>
        <div id="msg-recuperacao-sucesso" hidden style="margin-top: 0.8rem; background: rgba(34, 197, 94, 0.12); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); padding: 0.75rem; border-radius: 6px; font-size: 0.88rem; line-height: 1.5;"></div>
      </form>
    </div>
  </div>
</div>
<script type="module" src="index.js"></script>
</body>
</html>
