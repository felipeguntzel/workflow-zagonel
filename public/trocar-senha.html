<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkFlow Zagonel - Trocar Senha</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="componentes.css">
</head>
<body>
<div class="login-split">
  <div class="login-split__destaque">
    <img src="favicon.svg" alt="" class="login-split__logo">
    <h1>WorkFlow Zagonel</h1>
  </div>
  <div class="login-split__form">
    <form class="formulario" id="form-trocar-senha">
      <h2>Trocar senha</h2>
      <p>Esta é sua primeira vez entrando com essa senha, ou ela foi redefinida por um administrador. Escolha uma nova senha para continuar.</p>
      <label>Nova senha <span class="info" title="Mínimo de 8 caracteres. Deve conter letra maiúscula, minúscula, número e símbolo ou caractere especial (@, #, $, etc.).">i</span>
        <input type="password" name="nova_senha" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirmar nova senha
        <input type="password" name="confirmar_senha" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit">Salvar nova senha</button>
      <p id="mensagem-erro" class="erro" hidden></p>
    </form>
  </div>
</div>
<script type="module" src="trocar-senha.js"></script>
</body>
</html>
